# Externally maintained components, installed from their own source by
# `./install.sh <tool> --apply --external`. Adopted only when best-in-class for a category and
# actively maintained. Our toolkit never restates what these cover.
#
# Format (read by install.sh without a YAML library — keep to this shape):
#   tools:    which targets the entry applies to (claude, codex)
#   optional: true → listed but not installed by --external; install it yourself when decided
#   install:  one shell command per "- " line, run in order. Commands must be safe to rerun
#             and leave the latest version installed: ./update.sh simply reruns them.
#   folded fields (`>`) are documentation only

- name: impeccable
  category: design
  repo: https://github.com/pbakaus/impeccable
  license: Apache-2.0
  tools: claude, codex
  install:
    - npx -y impeccable@latest install --providers=claude,codex --scope=global
  covers: >
    Frontend design taste end to end: surface modes (persuade/operate/read/experience),
    new-work direction process, calibration against saturated AI looks, craft floor
    (contrast, spacing, type, motion, states, browser surfaces), refusal list, 25 commands
    (shape, critique, audit, polish, typeset, animate, ...), and an edit-time detector hook.
  why_not_rewritten: >
    Read 2026-10-13 against the other design upstreams (anthropics-skills frontend-design,
    gstack design-*, everything-claude-code frontend-design-direction, taste-skill): its craft
    floor and calibration already include their distinctive rules, and it adds an edit-time
    detector we cannot reproduce in prose. 650+ commits in the last month.
  notes: >
    The edit-time detector hook is installed per project, not globally: run
    `npx -y impeccable install` inside each project that should have it. Codex asks to
    approve that project hook (/hooks).

- name: last30days
  category: research
  repo: https://github.com/mvanhorn/last30days-skill
  license: MIT
  tools: claude, codex
  install:
    - npx -y skills@latest add mvanhorn/last30days-skill -g -a claude-code -a codex -y
  covers: >
    Recency-windowed signal collection across Reddit, Hacker News, arXiv, Techmeme,
    Polymarket and GitHub without API keys (X, TikTok, YouTube comments need optional keys).
    Used by market-scan as a signal source; its own "worthiness" score rates content
    appeal, not business opportunity, so scoring stays in market-scan.
  notes: >
    Use one install method per machine; Claude Code shows duplicates if both the plugin and
    the npx skills copy are installed.

- name: emil-design-engineering
  category: design
  repo: https://github.com/emilkowalski/skills
  license: MIT
  tools: claude, codex
  install:
    - npx -y skills@latest add emilkowalski/skills -g -a claude-code -a codex -s review-animations -s mobile-native -s break-ui -y
  covers: >
    Three skills that complement impeccable where it is thin: review-animations (motion
    standards: whether to animate by frequency, easing, exact curves), mobile-native (mobile web
    feel: viewport units, tap highlight, sticky hover, safe areas, real-device checks) and
    break-ui (plausible worst-case data behind a dev-only toggle; report before fixing).
  notes: >
    Do not install his `animate` skill alongside impeccable's animate command — they overlap.

- name: humanizer
  category: writing
  repo: https://github.com/blader/humanizer
  license: MIT
  tools: claude, codex
  install:
    - npx -y skills@latest add blader/humanizer -g -a claude-code -a codex -y
  covers: >
    English de-AI editing pass: 26 patterns of AI prose ranked by how much evidence each needs,
    a writing sample that overrides the rules, and a check that the rewrite added no facts.
    Used by the writing skill as its editing step.

- name: humanizer-zh
  category: writing
  repo: https://github.com/op7418/Humanizer-zh
  license: MIT
  tools: claude, codex
  install:
    - npx -y skills@latest add op7418/Humanizer-zh -g -a claude-code -a codex -y
  covers: >
    Chinese counterpart of humanizer: template phrasing, padding and inflated claims, while
    keeping facts, how certain each claim is, and the author's voice.

- name: webapp-testing
  category: engineering
  repo: https://github.com/anthropics/skills
  license: Apache-2.0
  tools: claude, codex
  install:
    - npx -y skills@latest add anthropics/skills -g -a claude-code -a codex -s webapp-testing -y
  covers: >
    Drives a local web app in a real browser with Playwright: starts the server(s), navigates,
    screenshots, reads console logs. The evidence `verification` asks for when the claim is
    "the UI works".

- name: mcp-builder
  category: ai-agents
  repo: https://github.com/anthropics/skills
  license: Apache-2.0
  tools: claude, codex
  optional: true
  install:
    - npx -y skills@latest add anthropics/skills -g -a claude-code -a codex -s mcp-builder -y
  covers: >
    Building an MCP server: tool design for agents, TypeScript and Python SDK patterns, and an
    evaluation harness. Install when building MCP servers.

- name: mcp-server-dev
  category: ai-agents
  repo: https://github.com/anthropics/claude-plugins-official
  license: Apache-2.0
  tools: claude
  optional: true
  install:
    - claude plugin marketplace add anthropics/claude-plugins-official
    - claude plugin install mcp-server-dev@claude-plugins-official
    - claude plugin update mcp-server-dev@claude-plugins-official
  covers: >
    Designing MCP servers for Claude: deployment model, search-then-execute tool pattern, auth
    (DCR / CIMD), MCP apps and bundles. Claude Code only.

- name: claude-security
  category: engineering
  repo: https://github.com/anthropics/claude-plugins-official
  license: proprietary (Anthropic, all rights reserved) — install only, never copied or rewritten here
  tools: claude
  optional: true
  install:
    - claude plugin marketplace add anthropics/claude-plugins-official
    - claude plugin install claude-security@claude-plugins-official
    - claude plugin update claude-security@claude-plugins-official
  covers: >
    Multi-agent vulnerability scan of your own code whose verifiers reject a finding unless an
    exploitation path is confirmed; SARIF output and a patch flow. The executable complement to
    the app-security method. Claude Code only.

- name: codex-plugin-cc
  category: ai-agents
  repo: https://github.com/openai/codex-plugin-cc
  license: Apache-2.0
  tools: claude
  install:
    - claude plugin marketplace add openai/codex-plugin-cc
    - claude plugin install codex@openai-codex
    - claude plugin update codex@openai-codex
  covers: >
    Hands a task, a second opinion or a stuck investigation from Claude Code to Codex
    (codex:codex-rescue agent and /codex commands). Needs the Codex CLI installed and signed in.

- name: claude-code-hooks
  category: hooks
  repo: https://github.com/karanb192/claude-code-hooks
  license: MIT
  tools: claude
  optional: true
  install:
    - claude plugin marketplace add karanb192/claude-code-hooks
    - claude plugin install guard-pack@claude-code-hooks
    - claude plugin install instructions-audit@claude-code-hooks
    - claude plugin install cache-tax@claude-code-hooks
    - claude plugin install subagent-spawn-cap@claude-code-hooks
  covers: >
    guard-pack (dangerous commands, secret files, git safety, test tampering, guardrail-config
    tampering — seven guards in one process); instructions-audit (hidden directives in loaded
    CLAUDE.md / rules); cache-tax (cold prompt-cache cost warning); subagent-spawn-cap.
    Tested upstream (1,900+ tests). Claude Code only.
  notes: >
    Optional because guard-pack's git-safety blocks direct changes on main/master at the
    default level; set HOOK_SAFETY_LEVEL or work on branches first. Codex relies on its own
    sandbox and approval policy instead.
