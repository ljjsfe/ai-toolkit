# Externally maintained components, installed from their own source by
# `./install.sh <tool> --apply --external`. Adopted only when best-in-class for a category and
# actively maintained. Our toolkit never restates what these cover.
#
# Format (read by install.sh and scripts/check.py without a YAML library — keep to this shape):
#   tools:    which targets the entry applies to (claude, codex, agy)
#   optional: true → listed but not installed by --external; install it yourself when decided
#   install:  one shell command per "- " line, run in order. Commands must be safe to rerun
#             and leave the latest version installed: ./update.sh simply reruns them.
#             install.sh automatically narrows --providers= and -a flags to the selected tool(s).
#   watch:    optional, comma-separated paths in the upstream repo worth re-reading when it
#             changes (default: the whole repo); documentation only, install.sh ignores it
#   status:   optional; when set to `trial` ("决定试用"), `trial_start: YYYY-MM-DD` and
#             `trial_review_by: YYYY-MM-DD` are required and enforced by `scripts/check.py`
#             (missing dates, unstarted trials, or past-due review dates fail validation)
#   folded fields (`>`) are documentation only

- name: impeccable
  category: design
  repo: https://github.com/pbakaus/impeccable
  license: Apache-2.0
  tools: claude, codex, agy
  install:
    - npx -y impeccable@latest install --providers=claude,codex,antigravity --scope=global -y --force
  covers: >
    Frontend design taste end to end: surface modes (persuade/operate/read/experience),
    new-work direction process, calibration against saturated AI looks, craft floor
    (contrast, spacing, type, motion, states, browser surfaces), refusal list, commands
    (shape, critique, audit, polish, typeset, animate, ...), and an edit-time detector hook.
  why_not_rewritten: >
    Read against anthropics-skills frontend-design, gstack design-*, everything-claude-code
    frontend-design-direction, and taste-skill v2: its craft floor and calibration already
    include their distinctive rules, and it adds an edit-time detector we cannot reproduce in
    prose. Covers both product UI and marketing pages.
  notes: >
    --scope=global registers the Claude Code detector hook in ~/.claude/settings.json and
    installs skills globally across selected providers. Codex hooks remain opt-in via /hooks.

- name: taste-skill
  category: design
  repo: https://github.com/Leonxlnx/taste-skill
  license: MIT
  tools: claude, codex, agy
  optional: true
  watch: skills/taste-skill
  install:
    - npx -y skills@latest add Leonxlnx/taste-skill -g -a claude-code -a codex -a antigravity -s design-taste-frontend -y
  covers: >
    v2.5+ (install name design-taste-frontend): art direction for landing pages, marketing sites,
    portfolios, plus --app and --film modes. Deals three of 20 directions from a 247-site study,
    builds with real open-licence pictures and footage found and credited by script (Openverse,
    Wikimedia, AIC, the Met), and gates in a real browser at 1440/768/390.
  notes: >
    Optional: use one design system per project because its house rules (no hairlines, no
    monospace, no eyebrows) contradict impeccable's. Needs Node 22+ and Chrome/Chromium; a full
    run costs 30-45 minutes and hundreds of thousands of tokens.

- name: last30days
  category: research
  repo: https://github.com/mvanhorn/last30days-skill
  license: MIT
  tools: claude, codex, agy
  install:
    - npx -y skills@latest add mvanhorn/last30days-skill -g -a claude-code -a codex -a antigravity -y
  covers: >
    Recency-windowed signal collection across Reddit, Hacker News, arXiv, Techmeme,
    Polymarket and GitHub without API keys (X, TikTok, YouTube comments need optional keys).
    Used by market-scan as a signal source; its own "worthiness" score rates content
    appeal, not business opportunity, so scoring stays in market-scan.
  notes: >
    Use one install method per machine; Claude Code shows duplicates if both the plugin and
    the npx skills copy are installed.

- name: emil-design-engineering
  category: design
  repo: https://github.com/emilkowalski/skills
  license: MIT
  tools: claude, codex, agy
  install:
    - npx -y skills@latest add emilkowalski/skills -g -a claude-code -a codex -a antigravity -s review-animations -s mobile-native -s break-ui -y
  covers: >
    Three skills that complement impeccable where it is thin: review-animations (motion
    standards: whether to animate by frequency, easing, exact curves), mobile-native (mobile web
    feel: viewport units, tap highlight, sticky hover, safe areas, real-device checks) and
    break-ui (plausible worst-case data behind a dev-only toggle; report before fixing).
  notes: >
    Do not install his `animate`, `emil-design-eng` or `prototype` skills alongside impeccable —
    impeccable already owns general UI design, prototyping and motion creation. Note that upstream
    `review-animations` sets `disable-model-invocation: true`, so invoke it explicitly (e.g. from
    `code-review`) when reviewing animation diffs.

- name: humanizer
  category: writing
  repo: https://github.com/blader/humanizer
  license: MIT
  tools: claude, codex, agy
  install:
    - npx -y skills@latest add https://github.com/blader/humanizer/tree/v3.1.0 -g -a claude-code -a codex -a antigravity -y
  covers: >
    English de-AI editing pass: 26 patterns of AI prose ranked by how much evidence each needs,
    a writing sample that overrides the rules, and a check that the rewrite added no facts.
    Used by the writing skill as its editing step.
  notes: >
    Pinned to v3.1.0 on 2026-11-14. v4.0.0 (2026-11-10) reverses the no-invention rule ("the
    skill no longer forbids adding facts"), which contradicts the writing skill's iron law 1.
    Move the pin only to a release that keeps the no-invention rule; read its release notes first.

- name: humanizer-zh
  category: writing
  repo: https://github.com/op7418/Humanizer-zh
  license: MIT
  tools: claude, codex, agy
  install:
    - npx -y skills@latest add op7418/Humanizer-zh -g -a claude-code -a codex -a antigravity -y
  covers: >
    Chinese counterpart of humanizer: template phrasing, padding and inflated claims, while
    keeping facts, how certain each claim is, and the author's voice.

- name: marketingskills-gtm
  category: product
  repo: https://github.com/coreyhaines31/marketingskills
  license: MIT
  tools: claude, codex, agy
  watch: skills/product-marketing, skills/launch, skills/onboarding, skills/signup, skills/churn-prevention, skills/referrals
  install:
    - npx -y skills@latest add coreyhaines31/marketingskills -g -a claude-code -a codex -a antigravity -s product-marketing -s launch -s onboarding -s signup -s churn-prevention -s referrals -y
  covers: >
    Go-to-market execution the toolkit had no skill for: positioning and ICP context
    (product-marketing), launch planning, onboarding and activation, signup and trial flows,
    churn prevention (cancel flows, dunning), referral programmes.
  why_not_rewritten: >
    A maintained, MIT, 60k-star collection with recent commits (2026-11-11); rewriting six
    execution playbooks would restate it. Only these six install: the repo's pricing,
    ab-testing, competitors, customer-research and copywriting skills would compete with
    pricing, experiment-readout, market-scan, customer-discovery and writing, which own those
    jobs here. The full set adds about 18,800 description characters; these six about 1,800.
  notes: >
    Evidence still comes from the toolkit's skills: demand from customer-discovery, price
    from pricing, launch metric reads from experiment-readout.

- name: modern-web-guidance
  category: engineering
  repo: https://github.com/GoogleChrome/modern-web-guidance
  license: Apache-2.0 (code), CC-BY-4.0 (guides)
  tools: claude, codex, agy
  optional: true
  status: trial
  trial_start: 2026-11-14
  trial_review_by: 2026-12-15
  watch: skills/modern-web-guidance
  install:
    - npx -y skills@latest add GoogleChrome/modern-web-guidance -g -a claude-code -a codex -a antigravity -s modern-web-guidance -y
  covers: >
    Vanilla web-platform guidance with Baseline support data and fallbacks (v1.0.0, 2026-11-10;
    co-stewarded with Edge, Firefox and MDN): platform APIs that replace JS libraries (popover,
    invokers, anchor positioning, view transitions, customizable select), Core Web Vitals (INP,
    LCP, long tasks), forms and autofill, accessibility, browser security (Trusted Types, CSP,
    passkeys), Temporal and Intl; a legacy-scan for modernisation. Nothing in the toolkit covers
    these; rules/typescript-web.md covers framework traps and overlaps only on React ViewTransition
    (its rule names the stable React version; this covers the browser API).
  why_not_rewritten: >
    About 209 guides re-checked against browser support data by the browser vendors, changing
    weekly; prose here could not keep up.
  notes: >
    Optional on purpose; install it yourself after deciding. Its CLI sends the agent name, guide
    IDs and search queries to Google unless DISABLE_TELEMETRY=1 is set in your shell profile
    (README "Telemetry & Privacy"). It fetches modern-web-guidance@latest from npm at use time.
    Its description costs about 855 characters resident (toolkit skills cap at 360). Skip the
    separate chrome-extensions skill. Claude Code's claude-plugins-official copy is frozen at
    v0.0.194, so use this install line or the googlechrome marketplace. On conflict, mobile-native
    wins on viewport units (svh for heroes, not dvh), review-animations on UI easing (no ease-in,
    under 300ms), and project rules over its "preferred local standard" claim. Trial passes if,
    on three real UI tasks, it changes the outcome versus impeccable alone.

- name: webapp-testing
  category: engineering
  repo: https://github.com/anthropics/skills
  license: Apache-2.0
  tools: claude, codex, agy
  watch: skills/webapp-testing
  install:
    - npx -y skills@latest add anthropics/skills -g -a claude-code -a codex -a antigravity -s webapp-testing -y
  covers: >
    Drives a local web app in a real browser with Playwright: starts the server(s), navigates,
    screenshots, reads console logs. The evidence `verification` asks for when the claim is
    "the UI works".
  notes: >
    Requires Playwright (`pip install playwright && playwright install chromium` or the project's
    own Playwright setup) for its browser helper scripts.

- name: agent-browser
  category: engineering
  repo: https://github.com/vercel-labs/agent-browser
  license: Apache-2.0
  tools: claude, codex, agy
  optional: true
  install:
    - npm install -g agent-browser@latest
    - npx -y skills@latest add vercel-labs/agent-browser -g -a claude-code -a codex -a antigravity -y
  covers: >
    Stateful headless-browser CLI daemon returning compact ref-tagged accessibility snapshots
    (@e1, @e2) in ~200-400 tokens instead of ad-hoc Playwright scripts or 10k-token DOM dumps.
  notes: >
    Optional faster/lower-token alternative to webapp-testing for interactive UI checks; run
    `agent-browser install` once after npm install to download Chromium. If WebKit/Safari parity
    is required, pair with or substitute `@playwright/cli` (microsoft/playwright-cli, Apache-2.0).

- name: mcp-builder
  category: ai-agents
  repo: https://github.com/anthropics/skills
  license: Apache-2.0
  tools: claude, codex, agy
  optional: true
  watch: skills/mcp-builder
  install:
    - npx -y skills@latest add anthropics/skills -g -a claude-code -a codex -a antigravity -s mcp-builder -y
  covers: >
    Building an MCP server: tool design for agents, TypeScript and Python SDK patterns, and an
    evaluation harness. Install when building MCP servers.

- name: mcp-server-dev
  category: ai-agents
  repo: https://github.com/anthropics/claude-plugins-official
  license: Apache-2.0
  tools: claude
  optional: true
  watch: plugins/mcp-server-dev
  install:
    - claude plugin marketplace add anthropics/claude-plugins-official
    - (claude plugin install -y mcp-server-dev@claude-plugins-official || true) && claude plugin update -y mcp-server-dev@claude-plugins-official
  covers: >
    Designing MCP servers for Claude: deployment model, search-then-execute tool pattern, auth
    (DCR / CIMD), MCP apps and bundles. Claude Code only.

- name: claude-security
  category: engineering
  repo: https://github.com/anthropics/claude-plugins-official
  license: proprietary (Anthropic, all rights reserved) — install only, never copied or rewritten here
  tools: claude
  optional: true
  watch: plugins/claude-security
  install:
    - claude plugin marketplace add anthropics/claude-plugins-official
    - (claude plugin install -y claude-security@claude-plugins-official || true) && claude plugin update -y claude-security@claude-plugins-official
  covers: >
    Multi-agent vulnerability scan of your own code whose verifiers reject a finding unless an
    exploitation path is confirmed; SARIF output and a patch flow. The executable complement to
    the app-security method. Claude Code only.

- name: codex-plugin-cc
  category: ai-agents
  repo: https://github.com/openai/codex-plugin-cc
  license: Apache-2.0
  tools: claude
  install:
    - claude plugin marketplace add openai/codex-plugin-cc
    - (claude plugin install -y codex@openai-codex || true) && claude plugin update -y codex@openai-codex
  covers: >
    Hands a task, a second opinion or a stuck investigation from Claude Code to Codex
    (codex:codex-rescue agent and /codex commands). Needs the Codex CLI installed and signed in.

- name: claude-code-hooks
  category: hooks
  repo: https://github.com/karanb192/claude-code-hooks
  license: MIT
  tools: claude
  optional: true
  install:
    - claude plugin marketplace add karanb192/claude-code-hooks
    - (claude plugin install -y guard-pack@claude-code-hooks || true) && claude plugin update -y guard-pack@claude-code-hooks
    - (claude plugin install -y instructions-audit@claude-code-hooks || true) && claude plugin update -y instructions-audit@claude-code-hooks
    - (claude plugin install -y cache-tax@claude-code-hooks || true) && claude plugin update -y cache-tax@claude-code-hooks
    - (claude plugin install -y subagent-spawn-cap@claude-code-hooks || true) && claude plugin update -y subagent-spawn-cap@claude-code-hooks
  covers: >
    guard-pack (dangerous commands, secret files, git safety, test tampering, guardrail-config
    tampering — seven guards in one process); instructions-audit (hidden directives in loaded
    CLAUDE.md / rules); cache-tax (cold prompt-cache cost warning); subagent-spawn-cap.
    Tested upstream (1,900+ tests). Claude Code only.
  notes: >
    Optional because guard-pack's git-safety blocks direct changes on main/master at the
    default level; set HOOK_SAFETY_LEVEL or work on branches first. Codex and Antigravity rely on
    their own terminal sandboxes and permission policies instead.
