# Sources for toolkit/rules/*.md. Kept out of the rule files themselves because rules are
# loaded into context and every token there is paid each session. Same format as a skill's
# `sources:`; validated and synced to CREDITS.md by `python3 scripts/check.py`.
core:
  - upstream/everything-claude-code/rules/common/{git-workflow,coding-style}.md (MIT) — commit type list, immutable updates, validation at system boundaries [port "type one of feat, fix" "prefer immutable updates" "validate at system boundaries"]
cpp:
  - C++ Core Guidelines (CP.44, CP.51, F.16, F.45, ES.84; MIT) — unnamed lock guards incl. unique_lock member shadowing, lambda and coroutine reference lifetimes, views over temporaries [port "always name the guard" "a reference parameter dangles" "over a borrowed"]
data-and-containers:
  - upstream/everything-claude-code/agents/database-reviewer.md (MIT) — structure from this source and the next; cursor pagination instead of OFFSET [port "paginate with a cursor"]
  - upstream/everything-claude-code/skills/{postgres-patterns,docker-patterns} (MIT) — RLS auth call wrapped in a subquery; pinned tags, non-root, no secrets in layers, ports bound to 127.0.0.1 [port "(select auth.uid()) = user_id" "only on 127.0.0.1"]
  - upstream/supabase-agent-skills/skills/supabase-postgres-best-practices (MIT) — SECURITY DEFINER search_path pinning, RLS predicate indexing and recursion, transaction-mode pooler limits [port "set search_path = ''" "index every column referenced in rls" "connection poolers in transaction mode"]
  - upstream/supabase-agent-skills/skills/supabase/SKILL.md (MIT) — views bypass RLS unless created with security_invoker on PG15+ [port "views bypass rls by default" "with (security_invoker = true)"]
  - upstream/supabase-agent-skills/skills/supabase/SKILL.md (MIT) — user_metadata is user-editable, TO authenticated alone is IDOR, UPDATE needs a SELECT policy, Storage upsert policies, user deletion keeps tokens valid [port "user_metadata is user-editable" "without an ownership predicate" "silently changes 0 rows" "needs insert, select and update" "leaves existing access tokens valid"]
flutter:
  - upstream/everything-claude-code/agents/flutter-reviewer.md (MIT) — mounted check after await, cancel subscriptions and controllers in dispose [port "if (!context.mounted) return;" "cancel every manual"]
  - upstream/everything-claude-code/rules/dart/coding-style.md (MIT) — sealed classes with exhaustive switches [port "exhaustive switches need no"]
kotlin:
  - Kotlin coroutines documentation (kotlinx.coroutines docs/topics/coroutines-cancellation.md, plus runCatching catching Throwable in the stdlib source; Apache-2.0) — rethrow CancellationException [port "never swallow cancellationexception" "catch it too, so rethrow it first"]
  - upstream/android-skills/system/edge-to-edge/SKILL.md (Apache-2.0) — enableEdgeToEdge, one inset method via Scaffold padding, adjustResize for keyboards [port "apply insets once" "set adjustresize on activities"]
  - Android developer docs, Android 15 behavior changes and the androidx.security release notes (CC-BY-2.5) — edge-to-edge enforced when targeting API 35; security-crypto deprecated in 1.1.0-alpha07 in favour of the Android Keystore [port "targetsdk 35 makes the app edge-to-edge" "deprecated since 1.1.0-alpha07"]
java:
  - upstream/jeffallan-claude-skills/skills/spring-boot-engineer (MIT) — WebSecurityConfigurerAdapter removal, no block() in WebFlux [port "websecurityconfigureradapter is removed" "never call .block()"]
python:
  - Python 3.11–3.13 documentation (PEP 654 except*, PEP 695 type parameter syntax, PEP 698 override, PEP 702 warnings.deprecated; PSF-2.0) — version-gated typing and ExceptionGroup handling [port "use except* valueerror" "require python 3.12+"]
react-native:
  - upstream/expo-skills/plugins/expo/skills/{eas-update,expo-dev-client,expo-native-ui,expo-web-to-native}/** (MIT) — OTA updates cannot add native code, runtime-version policy is a separate decision, EXPO_PUBLIC_ inlining, SecureStore over AsyncStorage, development builds beyond Expo Go's modules [port "never work around a runtime-version mismatch" "as an incidental fix" "inlined into the client bundle" "never asyncstorage" "runs only the native modules it bundles"]
swift:
  - upstream/twostraws-swiftui-agent-skill/swiftui-pro/{SKILL.md,references/{api,data,hygiene}.md} (MIT) — soft deprecations, deployment-target checks, private @State under the Xcode 27 macro, @AppStorage in @Observable, element-based row identity, SwiftData with CloudKit, Keychain for secrets [port "a warning-free build does not prove" "before using a newer api" "with xcode 27's @state macro" "even with @observationignored" "never indices or \.offset" "no @attribute(.unique)" "go in the keychain"]
typescript-web:
  - upstream/everything-claude-code/skills/nextjs-turbopack (MIT) — proxy.ts is not a misnamed middleware.ts [port "proxy.ts back to middleware.ts"]
  - upstream/everything-claude-code/rules/react/security.md (MIT) — Server Actions are public endpoints [port "server actions are public http endpoints"]
  - upstream/vercel-labs-agent-skills/skills/{react-best-practices,composition-patterns} (MIT) — children/slots over render functions across RSC boundaries, React.cache() per-request dedup, Next.js after() [port "jsx slot props" "with react.cache()" "with after() from next/server"]
  - upstream/vercel-next-js/skills (MIT) — Next.js 16 "use cache" / cacheLife / cacheTag and local version-matched docs in node_modules/next/dist/docs/ [port "cachelife + cachetag" "read the version-matched docs"]
  - upstream/vercel-next-js/{skills/next-cache-components-adoption,docs/01-app/03-api-reference/04-functions/{navigation,prefetch}.mdx} (MIT) — cacheComponents rejects dynamic/revalidate/fetchCache exports and the old dynamicIO key; navigation()/prefetch() lose the unstable_ prefix in 16.4 [port "errors on any file still exporting" "experimental.dynamicIO" "replace the canary-only"]
  - upstream/vercel-labs-agent-skills/skills/react-view-transitions (MIT) — ViewTransition and addTransitionType stable from React 19.3; no react@canary under the App Router [port "stable from react 19.3" "never install react@canary there"]
  - upstream/vercel-ai/skills/use-ai-sdk/SKILL.md (Apache-2.0) — bundled version-matched AI SDK docs, no model IDs from memory [port "same for the vercel ai sdk" "never write model ids from"]
web-platform:
  - upstream/googlechrome-modern-web-guidance/skills/modern-web-guidance/guides/{ui-components/dialog,ui-behaviors/declarative-dialog-popover-control,ui-behaviors/light-dismiss-a-dialog,ui-behaviors/prevent-page-scroll-under-modal-dialog}.md (CC-BY-4.0, adapted) — native dialog without ARIA or scroll-lock workarounds, closedby fallback, popover over overlay libraries, invoker commands; the guide's popovertarget/commandfor double-toggle warning is not ported (the HTML activation algorithm runs one or the other), and popovertarget is kept as a fallback [port "never lock scroll with" "keep a backdrop-click fallback" "instead of an overlay library" "safe fallback for browsers"]
  - upstream/googlechrome-modern-web-guidance/skills/modern-web-guidance/guides/{css/css-layout,ui-atoms/viewport-aware-dropdowns,forms/branded-select-styling}.md (CC-BY-4.0, adapted) — anchor positioning still limited with @supports gating, no 100vw for full width, customizable select degradation [port "keep an absolute-position fallback" "viewport units follow mobile-native" "drop the markup inside it"]
  - upstream/googlechrome-modern-web-guidance/skills/modern-web-guidance/guides/ui-behaviors/{same-document-transitions,cross-document-transitions}.md (CC-BY-4.0, adapted) — view transition support split between same- and cross-document [port "cross-document @view-transition has no firefox"]
  - authored for this toolkit (cross-source resolution with mobile-native and the review-animations external) — dvh for app shells vs svh for heroes; motion values defer to the motion rules, not the view-transition samples [port "which must not jump as the url bar moves" "not from the guide samples"]
  - upstream/googlechrome-modern-web-guidance/skills/modern-web-guidance/guides/performance/{performance,optimize-image-priority,break-up-long-tasks,defer-rendering-heavy-content}.md (CC-BY-4.0, adapted) — LCP image discoverable and prioritised, sizes with srcset, 50ms task slicing with a scheduler.yield fallback, worker offload, content-visibility with contain-intrinsic-size; the guide's no-store/bfcache line is qualified per Chrome's 2025 behaviour [port "it must be in the server html" "descriptors needs `sizes`" "split work longer than 50ms" "move work over ~250ms to a worker" "only on below-the-fold sections" "keep a page out of the back/forward cache"]
  - upstream/googlechrome-modern-web-guidance/skills/modern-web-guidance/guides/forms/{forms,autofill-sign-in-form,autofill-sign-up-form,sms-otp-form,ime-safe-enter-submit,validate-input-after-interaction}.md (CC-BY-4.0, adapted) — autocomplete tokens, single-field one-time codes, paste allowed, IME-safe Enter, user-invalid styling [port "or split boxes" "never block paste" "send half-composed text" "so untouched required fields stay clean"]
  - upstream/googlechrome-modern-web-guidance/skills/modern-web-guidance/guides/security/{security,trusted-types,sanitize-untrusted-html}.md (CC-BY-4.0, adapted) — safe sinks, Sanitizer with DOMPurify fallback, no pass-through Trusted Types policy, nonce plus strict-dynamic CSP via report-only [port "load dompurify on demand" "never a pass-through" "a domain allowlist is not a script-src defence"]
  - upstream/googlechrome-modern-web-guidance/skills/modern-web-guidance/guides/js/{capture-location-agnostic-data,coordinate-global-events}.md (CC-BY-4.0, adapted) — Temporal Plain types vs ZonedDateTime, IANA zones, conditional polyfill [port "with iana zone names" "load temporal-polyfill behind a check"]
  - web-platform-dx/web-features data (Apache-2.0), https://github.com/web-platform-dx/web-features — Baseline status of every support claim re-checked on 2026-11-14; corrects the guides' anchor-positioning snapshot [port "full feature needs chrome 157"]
